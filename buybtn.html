<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy or Rent - GameSpace</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --card: #121826;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1e2d45;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle at 0% 0%, #162036 0%, transparent 40%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .back-nav {
      position: absolute;
      top: 40px;
      left: 40px;
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      transition: color 0.3s;
    }

    .back-nav:hover { color: var(--text); }

    .product-container {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 60px;
      align-items: center;
    }

    .game-preview { position: relative; perspective: 1000px; }

    .game-preview img {
      width: 100%;
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border);
      transition: transform 0.5s ease;
    }

    .game-preview:hover img { transform: rotateY(-5deg) rotateX(2deg); }

    .purchase-card {
      background: rgba(18, 24, 38, 0.8);
      backdrop-filter: blur(12px);
      padding: 48px;
      border-radius: 32px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    .tag {
      display: inline-block;
      background: rgba(59, 130, 246, 0.1);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 16px;
    }

    .game-meta h1 { font-size: 42px; margin: 0 0 12px 0; letter-spacing: -1px; }

    .game-meta p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .options-group { display: flex; flex-direction: column; gap: 16px; }

    .option-box {
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
    }

    .option-box:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #334155;
      transform: translateY(-2px);
    }

    .option-box.active {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.05);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .option-info h3 { margin: 0; font-size: 19px; font-weight: 600; }

    .option-info p { margin: 4px 0 0 0; font-size: 13px; color: var(--muted); }

    .price-tag { font-size: 22px; font-weight: 800; color: var(--text); }

    .active .price-tag { color: var(--accent); }

    .action-button {
      width: 100%;
      margin-top: 32px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 20px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
      transition: all 0.3s;
    }

    .action-button:hover {
      background: #2563eb;
      box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
    }

    @media (max-width: 900px) {
      .product-container { grid-template-columns: 1fr; gap: 40px; }
      .back-nav { top: 20px; left: 20px; }
      .game-meta h1 { font-size: 32px; }
    }
  </style>
</head>

<body>

  <a href="ui.html" class="back-nav">← Back to Store</a>

  <div class="product-container">
    <div class="game-preview">
      <img id="gameImg" src="images/placeholder.jpg" alt="Loading...">
    </div>

    <div class="purchase-card">
      <div class="game-meta">
        <span class="tag">Digital & Physical Available</span>
        <h1 id="gameTitle">Title</h1>
        <p>Get ready for an immersive experience. Buy to keep forever or rent for a quick weekend playthrough. All pre-owned discs are quality-checked.</p>
      </div>

      <div class="options-group">
        <div class="option-box active" onclick="selectOption(this, 'Buy')">
          <div class="option-info">
            <h3>Buy Forever</h3>
            <p>Own the physical disc</p>
          </div>
          <div id="buyPrice" class="price-tag">₹0</div>
        </div>

        <div class="option-box" onclick="selectOption(this, 'Rent')">
          <div class="option-info">
            <h3>7-Day Rental</h3>
            <p>Play for a week</p>
          </div>
          <div id="rentPrice" class="price-tag">₹0</div>
        </div>
      </div>

      <button class="action-button" onclick="goToCheckout()">Proceed to Checkout →</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameName  = urlParams.get('game')  || "Unknown Game";
    const imageSrc  = urlParams.get('img')   || "images/placeholder.jpg";
    const rawPrice  = urlParams.get('price');
    const basePrice = parseInt(rawPrice) || 1599;
    const calculatedRent = Math.round(basePrice * 0.3);

    document.getElementById('gameTitle').innerText = gameName;
    document.getElementById('gameImg').src = imageSrc;
    document.getElementById('buyPrice').innerText  = "₹" + basePrice.toLocaleString('en-IN');
    document.getElementById('rentPrice').innerText = "₹" + calculatedRent.toLocaleString('en-IN');

    let selectedMode = 'Buy';

    function selectOption(el, mode) {
      document.querySelectorAll('.option-box').forEach(box => box.classList.remove('active'));
      el.classList.add('active');
      selectedMode = mode;
    }

    function goToCheckout() {
      // Pass all needed data to the checkout page via URL params
      const params = new URLSearchParams({
        game:  gameName,
        img:   imageSrc,
        price: basePrice,
        mode:  selectedMode
      });
      window.location.href = 'checkout.html?' + params.toString();
    }
  </script>
</body>
</html>
