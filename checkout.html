<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - GameSpace</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --card: #121826;
      --accent: #3b82f6;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1e2d45;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }

    a.back { color: var(--muted); text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 30px; }
    a.back:hover { color: var(--text); }

    h2 { font-size: 24px; margin-bottom: 20px; }

    .container { max-width: 600px; margin: 0 auto; }

    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .section h3 { font-size: 16px; margin-bottom: 16px; color: var(--accent); }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 14px;
    }

    label:first-of-type { margin-top: 0; }

    input, select {
      width: 100%;
      background: #0b0f14;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .pay-options { display: flex; gap: 10px; margin-bottom: 16px; }

    .pay-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      transition: all 0.2s;
    }

    .pay-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(59,130,246,0.08);
    }

    .pay-panel { display: none; }
    .pay-panel.active { display: block; }

    .order-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(59,130,246,0.07);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .order-box span:last-child { font-weight: 700; color: var(--accent); }

    .btn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s;
    }

    .btn:hover { background: #2563eb; }

    select option { background: #121826; }
  </style>
</head>
<body>

<div class="container">
  <a href="javascript:history.back()" class="back">← Back</a>
  <h2>Checkout</h2>

  <div class="order-box">
    <span id="orderLabel">Loading...</span>
    <span id="orderPrice">₹0</span>
  </div>

  <!-- Customer Details -->
  <div class="section">
    <h3>Your Details</h3>
    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter your name" />
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" />
    <label>Phone</label>
    <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" />
  </div>

  <!-- Address -->
  <div class="section">
    <h3>Delivery Address</h3>
    <label>Address</label>
    <input type="text" id="address" placeholder="House no., Street, Area" />
    <label>City</label>
    <input type="text" id="city" placeholder="City" />
    <div class="row" style="margin-top:14px;">
      <div>
        <label style="margin-top:0">State</label>
        <select id="state">
          <option value="">Select State</option>
          <option>Delhi</option>
          <option>Maharashtra</option>
          <option>Karnataka</option>
          <option>Tamil Nadu</option>
          <option>Uttar Pradesh</option>
          <option>West Bengal</option>
          <option>Gujarat</option>
          <option>Rajasthan</option>
          <option>Himachal Pradesh</option>
          <option>Punjab</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label style="margin-top:0">PIN Code</label>
        <input type="text" id="pin" placeholder="6-digit PIN" maxlength="6" />
      </div>
    </div>
  </div>

  <!-- Payment -->
  <div class="section">
    <h3>Payment Method</h3>
    <div class="pay-options">
      <button class="pay-btn active" onclick="showPay('card', this)">💳 Card</button>
      <button class="pay-btn" onclick="showPay('upi', this)">📱 UPI</button>
      <button class="pay-btn" onclick="showPay('cod', this)">🏠 COD</button>
    </div>

    <div class="pay-panel active" id="panel-card">
      <label>Card Number</label>
      <input type="text" id="cardNum" placeholder="0000 0000 0000 0000" maxlength="19" />
      <div class="row" style="margin-top:14px;">
        <div>
          <label style="margin-top:0">Expiry (MM/YY)</label>
          <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" />
        </div>
        <div>
          <label style="margin-top:0">CVV</label>
          <input type="password" id="cvv" placeholder="•••" maxlength="3" />
        </div>
      </div>
    </div>

    <div class="pay-panel" id="panel-upi">
      <label>UPI ID</label>
      <input type="text" id="upiId" placeholder="name@upi" />
    </div>

    <div class="pay-panel" id="panel-cod">
      <p style="color: var(--muted); font-size: 14px; padding: 10px 0;">Pay cash when your order arrives. ₹49 extra COD fee applies.</p>
    </div>
  </div>

  <button class="btn" onclick="placeOrder()">Place Order</button>
</div>

<script>
  const p = new URLSearchParams(window.location.search);
  const game  = p.get('game')  || 'Game';
  const mode  = p.get('mode')  || 'Buy';
  const price = parseInt(p.get('price')) || 1599;
  const rent  = Math.round(price * 0.3);
  const finalPrice = mode === 'Rent' ? rent : price;

  document.getElementById('orderLabel').textContent = game + ' — ' + (mode === 'Rent' ? '7-Day Rental' : 'Buy Forever');
  document.getElementById('orderPrice').textContent = '₹' + finalPrice.toLocaleString('en-IN');

  function showPay(type, btn) {
    document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.pay-panel').forEach(panel => panel.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + type).classList.add('active');
  }

  function placeOrder() {
    var name    = document.getElementById('name').value.trim();
    var email   = document.getElementById('email').value.trim();
    var phone   = document.getElementById('phone').value.trim();
    var address = document.getElementById('address').value.trim();
    var city    = document.getElementById('city').value.trim();
    var state   = document.getElementById('state').value;
    var pin     = document.getElementById('pin').value.trim();

    if (!name || !email || !phone || !address || !city || !state || !pin) {
      alert('Please fill in all fields.');
      return;
    }
    if (phone.length !== 10) {
      alert('Please enter a valid 10-digit phone number.');
      return;
    }
    if (pin.length !== 6) {
      alert('Please enter a valid 6-digit PIN code.');
      return;
    }

    alert('Order Placed!\n\nGame: ' + game + '\nMode: ' + mode + '\nPrice: ₹' + finalPrice.toLocaleString('en-IN') + '\n\nThank you, ' + name + '!');
  }
</script>
</body>
</html>
