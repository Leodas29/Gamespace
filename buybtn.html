<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Resident Evil 4</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      color: #e5e7eb;
      background: #0b0f14 no-repeat center center fixed;
      background-size: cover;
      transition: background 1s ease-in-out;
    }
    .overlay {
      background: rgba(0,0,0,0.7);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #121826;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      animation: fadeInUp 1s ease-out;
    }
    h1 { color: #3b82f6; text-align: center; }
    label { display:block; margin-top:16px; font-weight:600; }
    input, select {
      width:100%; padding:12px; margin-top:8px;
      border-radius:8px; border:none; background:#1f2937; color:#e5e7eb;
    }
    button {
      margin-top:24px; padding:14px; width:100%;
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color:white; border:none; border-radius:10px; font-weight:700;
      cursor:pointer; transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    button:hover { transform: translateY(-3px); box-shadow:0 6px 15px rgba(22,163,74,0.6); }
    @keyframes fadeInUp { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="container">
      <h1>Buy Resident Evil 4</h1>
      <form>
        <label>Full Name</label>
        <input type="text" required>
        <label>Email (Activation Key will be sent here)</label>
        <input type="email" required>
        <label>Payment Method</label>
        <select required>
          <option value="">Select</option>
          <option>Credit Card</option>
          <option>Debit Card</option>
          <option>UPI</option>
          <option>Net Banking</option>
          <option>PayPal</option>
        </select>
        <button type="submit">Confirm Purchase</button>
      </form>
    </div>
  </div>

  <script>
    // Get background image from URL parameter
    const params = new URLSearchParams(window.location.search);
    const bg = params.get("bg");
    if(bg) {
      document.body.style.backgroundImage = `url('${bg}')`;
    }
  </script>
</body>
</html>
